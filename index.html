<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/ehw-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Elevate Health and Fitness generates personalized training programs and analyzes exercise media for form feedback."
    />
    <title>Elevate Health and Fitness</title>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2282716289212649');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
    <!--
      This fires one PageView on load. The app is a single page with hash
      routing, so every later step (#pricing, #apply, the assessment) happens
      without a reload and would otherwise be invisible to Meta. src/lib/pixel.js
      sends those, and the funnel events that matter.
    -->
  </head>
  <body>
    <!-- Meta Pixel no-script fallback. Lives here rather than in <head>, where
         a <noscript> may only contain link, style and meta, and an <img> inside
         one made the build unable to parse the document. -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=2282716289212649&amp;ev=PageView&amp;noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
